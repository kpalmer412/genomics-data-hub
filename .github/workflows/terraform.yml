name: "Terraform CI"

# This triggers the automation every single time you push code to main
on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: "Validate Infrastructure"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.1"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

            # Safely plans the change to verify your S3 backend and locks work correctly
      - name: Terraform Plan
        run: terraform plan -no-color
        env:
          TF_VAR_state_bucket_name: "ken-genomics-tfstate-2026"
